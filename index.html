<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

<header>
    <h1>📚 My Library</h1>
    <button id="new-book-btn">New Book</button>
</header>

<main>
    <div id="library"></div>
</main>

<dialog id="book-dialog">

    <form id="book-form">

        <h2>Add Book</h2>

        <input
            type="text"
            id="title"
            placeholder="Title"
            required
        >

        <input
            type="text"
            id="author"
            placeholder="Author"
            required
        >

        <input
            type="number"
            id="pages"
            placeholder="Pages"
            required
        >

        <label>
            <input type="checkbox" id="read">
            Read
        </label>

        <div class="buttons">
            <button type="submit">Save</button>
            <button type="button" id="cancel-btn">Cancel</button>
        </div>

    </form>

</dialog>

</body>
</html>
